name: Mobile Android Release

# Why a separate workflow from iOS: iOS releases go through App Store review,
# which can take days. Decoupling the triggers lets an Android release ship
# immediately without waiting on iOS, and vice versa.
on:
  push:
    branches:
      - main
    tags:
      - 'mobile-android-v*'
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android-release.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional exact mobile marketing version assertion, e.g. 0.0.22'
        required: false
        type: string
      publish_github_release:
        description: 'Create or update the mobile-android-v<version> GitHub Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: mobile-android-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  android-build:
    # Why: main-push releases are for the private fork; tag and manual releases
    # keep their existing behavior in every repository.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main' || github.repository == 'kargnas/orca'
    runs-on: ubuntu-latest

    # Why: the "Create GitHub Release" step below uses the default GITHUB_TOKEN
    # to call `gh release create`, which requires contents:write. Without this,
    # the job builds the APK fine but fails at release time with
    # "HTTP 403: Resource not accessible by integration".
    permissions:
      contents: write

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Free runner disk space
        # Why: the mobile dependency tree and Gradle build exceed the default Ubuntu runner's free space.
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo apt-get clean
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version and version code
        id: release
        env:
          MOBILE_ANDROID_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          MOBILE_ANDROID_PUBLISH_RELEASE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.publish_github_release }}
        run: node scripts/prepare-android-release.mjs

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build Android release APK
        run: cd android && ./gradlew assembleRelease

      - name: Name release APK
        id: apk
        env:
          PRIVATE_MAIN_RELEASE: ${{ github.event_name == 'push' && github.repository == 'kargnas/orca' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/release/app-release.apk"
          short_sha="${GITHUB_SHA:0:7}"
          if [[ "$PRIVATE_MAIN_RELEASE" == "true" ]]; then
            apk_name="orca-mobile-${{ steps.release.outputs.version }}-build${{ steps.release.outputs.android_version_code }}-${short_sha}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}.apk"
            mv "$apk_path" "android/app/build/outputs/apk/release/$apk_name"
            apk_path="android/app/build/outputs/apk/release/$apk_name"
            checksum_path="$apk_path.sha256"
            (cd "$(dirname "$apk_path")" && sha256sum "$apk_name" > "$apk_name.sha256")
            echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: orca-mobile-apk
          path: mobile/${{ steps.apk.outputs.path }}

      - name: Ensure GitHub release tag
        if: steps.release.outputs.publish_release == 'true' && !startsWith(github.ref, 'refs/tags/mobile-android-v')
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"

          remote_target="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')"
          if [[ -n "$remote_target" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" || "$remote_target" == "$GITHUB_SHA" ]]; then
              echo "Tag $tag already targets the requested release"
              exit 0
            fi

            # Why: one prerelease belongs to each committed app version, so a
            # later main build of that version must keep its source tag aligned.
            git tag --force "$tag" "$GITHUB_SHA"
            git push --force-with-lease="refs/tags/$tag:$remote_target" origin "refs/tags/$tag"
            exit 0
          fi

          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Create GitHub Release
        if: steps.release.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_MAIN_RELEASE: ${{ github.event_name == 'push' && github.repository == 'kargnas/orca' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          apk_path="${{ steps.apk.outputs.path }}"
          checksum_path="${{ steps.apk.outputs.checksum_path }}"

          if [[ "$PRIVATE_MAIN_RELEASE" == "true" ]]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                "$apk_path" "$checksum_path"
            else
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Orca Mobile Android $tag" \
                --prerelease \
                --latest=false \
                --generate-notes \
                --target "$GITHUB_SHA" \
                "$apk_path" "$checksum_path"
            fi
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "$apk_path"
          else
            # Why: release tags live on side branches, so GitHub's automatic
            # previous-tag detection reaches back several releases; that body
            # already exceeds the 125000-character API limit and grows each
            # release. Pin the comparison base and cap the size.
            notes_file="$RUNNER_TEMP/android-release-notes.md"
            previous_tag="$(
              gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
                | grep '^mobile-android-v' | grep -Fxv "$tag" | sort -V | tail -1 || true
            )"

            if [ -n "$previous_tag" ]; then
              # Why: gh writes the JSON error body to stdout on an HTTP error, so a
              # non-empty file is not proof of success — gate on exit status.
              if ! gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -X POST \
                -f tag_name="$tag" \
                -f target_commitish="$GITHUB_SHA" \
                -f previous_tag_name="$previous_tag" \
                --jq .body > "$notes_file"; then
                : > "$notes_file"
              fi
            fi
            if [ ! -s "$notes_file" ]; then
              printf 'Orca Mobile Android %s\n' "$tag" > "$notes_file"
            fi
            # Why: reuse the desktop release path's character-safe truncation so a
            # multi-byte character cannot be split at the cap.
            NOTES_FILE="$notes_file" \
            NOTES_MODULE="$GITHUB_WORKSPACE/config/scripts/create-draft-release.mjs" \
            node --input-type=module -e '
              const { readFileSync, writeFileSync } = await import("node:fs")
              const { pathToFileURL } = await import("node:url")
              const { truncateReleaseBody } = await import(pathToFileURL(process.env.NOTES_MODULE).href)
              const file = process.env.NOTES_FILE
              writeFileSync(file, truncateReleaseBody(readFileSync(file, "utf8")))
            '

            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Orca Mobile Android $tag" \
              --prerelease \
              --latest=false \
              --notes-file "$notes_file" \
              "$apk_path"
          fi
