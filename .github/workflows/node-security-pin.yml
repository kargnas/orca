name: Node security pin

# Why: pull_request workflows such as PR Checks are disabled_manually on this
# repository, and enabling them is outside the token's permission. This job is
# the runnable gate for the October 2026 Node 22/24/26 pins.
on:
  pull_request:
  push:
    branches:
      - cursor/pin-node-brotli-rce-bc79

permissions:
  contents: read

concurrency:
  group: node-security-pin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: patched Node 22/24/26
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Node security pins
        run: node config/scripts/node-security-pin.mjs
